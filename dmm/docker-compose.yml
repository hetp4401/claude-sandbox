services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dmm
      POSTGRES_USER: dmm
      POSTGRES_PASSWORD: dmm
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmm"]
      interval: 5s
      timeout: 5s
      retries: 5

  dmm:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://dmm:dmm@postgres:5432/dmm

volumes:
  pg-data:
